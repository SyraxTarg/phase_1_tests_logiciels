    #       libgtk-4-1 libgraphene-1.0-0 libevent-2.1-7 libopus0 \
    #       libgstreamer-plugins-base1.0-0 libgstreamer1.0-0 \
    #       libwoff2-1 libx264-163 libavif16 libwayland-server0 \
    #       libsecret-1-0 libhyphen0 libharfbuzz-icu0 \
    #       libgstreamer-plugins-base1.0-0 libflite1

    # - name: Lauch functionnal tests
    #   working-directory: ./frontend
    #   env:
    #     API_URL: http://localhost:3001
    #     URL_PAGE: http://localhost:3000
    #   run: |
    #     npx playwright install
    #     npx playwright test

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      working-directory: ./frontend
      env:
        API_URL: http://localhost:3001
        URL_PAGE: http://localhost:3000
      run: npx playwright test

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30