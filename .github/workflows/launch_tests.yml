name: Lauch tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests-back:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['22.x']

    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      working-directory: ./back
      run: npm ci

    - name: Launch unit tests
      working-directory: ./back
      run: npm test


  functional-tests-front:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['22.x']

    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Reset database
      working-directory: ./back
      env:
          DATABASE_URL: file:./pokecenter.db
      run: |
        rm -f pokecenter.db
        npm install prisma dotenv
        npx prisma db push
        npx prisma generate
        node ./scripts/seed_db.js

    - name: Launch backend
      working-directory: ./back
      env:
        LISTEN_PORT: 3001
        DATABASE_URL: file:./pokecenter.db
        JWT_SECRET: secret
      run: node index.js &

    # - name: Launch frontend
