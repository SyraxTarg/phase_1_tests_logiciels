name: Lauch tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests-back:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['22.x']

    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      working-directory: ./back
      run: npm ci

    - name: Launch unit tests
      working-directory: ./back
      run: npm test


  functional-tests-front:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['22.x']

    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Reset database
      working-directory: ./back
      env:
          DATABASE_URL: file:./test.db
      run: |
        rm -f test.db
        npm install prisma dotenv
        npx prisma db push
        npx prisma generate
        node ./scripts/seed_db.js

    - name: Launch backend
      working-directory: ./back
      env:
        LISTEN_PORT: 3001
        DATABASE_URL: file:./pokecenter.db
        JWT_SECRET: secret
      run: node index.js &

    - name: Launch frontend
      working-directory: ./frontend
      env:
        API_URL: http://localhost:3001
        URL_PAGE: http://localhost:3002
      run: |
        npm run build
        npm run start &

    - name: Wait for app
      run: npx wait-on http://localhost:3002

    - name: Lauch functionnal tests
      working-directory: ./frontend
      run: npx playwright test