name: Load Test

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
    workflow_dispatch:
        inputs:
            users:
                description: "Number of users"
                default: "100"
            duration:
                description: "Test duration"
                default: "5m"

env:
    TARGET_HOST: http://localhost:3001

jobs:
    load-test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install dependencies
              working-directory: ./back
              run: |
                  pip install locust
                  pip install -r requirements.txt

            - name: Reset database
              working-directory: ./back
              env:
                  DATABASE_URL: file:./pokecenter.db
              run: |
                  rm -f pokecenter.db
                  npm install prisma dotenv
                  npx prisma db push
                  npx prisma generate
                  node ./scripts/seed_db.js

            - name: Launch Backend
              working-directory: ./back
              env:
                  DATABASE_URL: file:./pokecenter.db
                  JWT_SECRET: secret
                  LISTEN_PORT: 3001
              run: node index.js &

            - name: Wait for staging deployment
              run: |
                  # Wait for staging to be ready (customize as needed)
                  for i in {1..30}; do
                    if curl -s -o /dev/null -w "%{http_code}" $TARGET_HOST/health | grep -q "200"; then
                      echo "Staging is ready"
                      exit 0
                    fi
                    echo "Waiting for staging... attempt $i"
                    sleep 10
                  done
                  echo "Staging not ready after 2 minutes"
                  exit 1

            - name: Run load test
              working-directory: ./back
              run: |
                  locust \
                    --headless \
                    --host=$TARGET_HOST \
                    --users=10\
                    --spawn-rate=1 \
                    --run-time=30 \
                    --csv=results \
                    --html=report.html \
                    --locustfile=__tests__/load/locustfile.py

            - name: Upload test results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: load-test-results
                  path: |
                      back/results_stats.csv
                      back/results_stats_history.csv
                      back/results_failures.csv
                      back/report.html

            - name: Post results to PR
              if: github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');

                      // Read CSV results
                      const stats = fs.readFileSync('back/results_stats.csv', 'utf8');
                      const lines = stats.trim().split('\n');
                      const headers = lines[0].split(',');
                      const aggregated = lines[lines.length - 1].split(',');

                      // Build comment
                      const comment = `## Load Test Results

                      | Metric | Value |
                      |--------|-------|
                      | Total Requests | ${aggregated[2]} |
                      | Failure Rate | ${aggregated[4]}% |
                      | Avg Response Time | ${aggregated[5]}ms |
                      | P95 Response Time | ${aggregated[8]}ms |
                      | Requests/sec | ${aggregated[9]} |

                      [Full Report](../actions/runs/${context.runId})
                      `;

                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: comment
                      });
